name: FounderLink CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  server-ci:
    name: Server Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        run: npm ci
        working-directory: ./server

      - name: Server Lint
        run: npm run lint
        working-directory: ./server

      - name: Server Tests
        run: npm run test
        working-directory: ./server

  client-ci:
    name: Client Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install client dependencies
        run: npm ci
        working-directory: ./client

      - name: Client Lint
        run: npm run lint
        working-directory: ./client

      - name: Client Test
        run: npm run test --if-present
        working-directory: ./client

      - name: Client Build
        run: npm run build
        working-directory: ./client

